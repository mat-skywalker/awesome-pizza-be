openapi: 3.0.3
info:
  title: Awesome Pizza Ordering API
  description: APIs to manage orders for Awesome Pizza pizzeria.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: CustomerOrders
    description: Customer Operations
  - name: KitchenManagement
    description: Chef Operations

paths:
  /orders:
    post:
      tags:
        - CustomerOrders
      summary: Create a new pizza order
      description: Allows a user to place an order. Returns the order code and details for tracking.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /orders/{orderCode}:
    get:
      tags:
        - CustomerOrders
      summary: Tracks the order state
      description: Allows a client to check the state of an order through a univoque code.
      operationId: getOrderByCode
      parameters:
        - name: orderCode
          in: path
          required: true
          description: Univoque order code for the client
          schema:
            type: string
            example: "AP-9B3E12"
      responses:
        '200':
          description: Order details found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /kitchen/orders/pending:
    get:
      tags:
        - KitchenManagement
      summary: Retrieve the queue of pending orders.
      description: Shows the list of orders waiting to be processed (PENDING status) sorted by creation time.
      operationId: getPendingOrders
      responses:
        '200':
          description: List of orders in queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /kitchen/orders/take-next:
    post:
      tags:
        - KitchenManagement
      summary: Picks up the next order in queue
      description: Assigns the chef the first in line order, settings its state to IN_PREPARATION.
      operationId: takeNextOrder
      responses:
        '200':
          description: Order taken with success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: No order to be prepared in line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /kitchen/orders/{orderCode}/complete:
    post:
      tags:
        - KitchenManagement
      summary: Mark the order as COMPLETED
      description: Change the order status from IN_PREPARATION to COMPLETED.
      operationId: completeOrder
      parameters:
        - name: orderCode
          in: path
          required: true
          description: Unique order code to complete
          schema:
            type: string
            example: "AP-9B3E12"
      responses:
        '200':
          description: Order completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: State transition not allowed (e.g. order not being prepared)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    OrderStatus:
      type: string
      enum:
        - PENDING
        - IN_PREPARATION
        - COMPLETED
      example: PENDING

    OrderItemRequest:
      type: object
      required:
        - pizzaName
        - quantity
      properties:
        pizzaName:
          type: string
          minLength: 2
          maxLength: 100
          example: "Margherita"
        quantity:
          type: integer
          minimum: 1
          example: 2
        notes:
          type: string
          maxLength: 255
          example: "Ben cotta, senza basilico"

    CreateOrderRequest:
      type: object
      required:
        - customerName
        - items
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 100
          example: "Mario Rossi"
        customerPhoneNumber:
          type: string
          pattern: "^[+0-9 ]{6,20}$"
          example: "+39 333 1234567"
        deliveryNotes:
          type: string
          maxLength: 255
          example: "Citofonare scala B"
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    OrderItemResponse:
      type: object
      required:
        - id
        - pizzaName
        - quantity
      properties:
        id:
          type: integer
          format: int64
          example: 101
        pizzaName:
          type: string
          example: "Margherita"
        quantity:
          type: integer
          example: 2
        notes:
          type: string
          example: "Ben cotta, senza basilico"

    OrderResponse:
      type: object
      required:
        - orderCode
        - status
        - customerName
        - items
        - createdAt
      properties:
        orderCode:
          type: string
          example: "AP-9B3E12"
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerName:
          type: string
          example: "Mario Rossi"
        deliveryNotes:
          type: string
          example: "Citofonare scala B"
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        createdAt:
          type: string
          format: date-time
          example: "2026-11-05T19:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-05T19:35:00Z"

    ApiError:
      type: object
      required:
        - timestamp
        - status
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-11-05T19:30:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "L'ordine deve contenere almeno una pizza."
        details:
          type: array
          items:
            type: string
          example: ["items: non deve essere vuoto"]