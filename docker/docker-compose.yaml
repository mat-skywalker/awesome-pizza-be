# Use postgres/example user/password credentials
version: '3.1'

services:
  postgres:
    container_name: postgres_awesome_pizza
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: awesome_pizza
    ports:
      - 5433:5432
    volumes:
      - awesome_pizza_be_data:/var/lib/postgresql

volumes:
  awesome_pizza_be_data:
